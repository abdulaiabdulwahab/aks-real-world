apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: web-hpa
  namespace: production

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: web

  minReplicas: 2

  maxReplicas: 8

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          # Scale when average CPU exceeds 50%
          # of the requested CPU.
          averageUtilization: 50